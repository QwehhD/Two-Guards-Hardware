; Two-Guards — firmware portal parkir (ESP32 + RC522 + servo).
; Kontrak MQTT: Two-Guards/docs/mqtt-topics.md. Cara pakai: README.md.
;
; Framework Arduino, bukan ESP-IDF: builder ESP-IDF menolak path project yang
; mengandung spasi ("Visual Studio Code", "Two Guard"), Arduino tidak.
;
; Semua versi dikunci supaya build hari ini dan build berikutnya identik.

[platformio]
default_envs = portal

[esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; 921600 gagal di CP2102 board ini ("No serial data received"); 460800 stabil.
upload_speed = 460800
; Peringatan hanya untuk kode kita, bukan untuk core Arduino dan library.
build_src_flags = -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    miguelbalboa/MFRC522@1.4.12
    madhephaestus/ESP32Servo@3.2.1
    256dpi/MQTT@2.5.3

; Firmware utama.
[env:portal]
extends = esp32
build_src_filter = +<app/>

; Bring-up hardware. Tiap test memakai modul yang sama dengan firmware utama,
; jadi yang diuji adalah kode yang nanti benar-benar jalan.
[env:rfid-test]
extends = esp32
build_src_filter = +<hwtest/rfid_test.cpp> +<app/rfid_reader.cpp>

[env:servo-test]
extends = esp32
build_src_filter = +<hwtest/servo_test.cpp> +<app/gate_servo.cpp>

[env:wifi-test]
extends = esp32
build_src_filter = +<hwtest/wifi_test.cpp> +<app/network.cpp>

[env:power-test]
extends = esp32
build_src_filter = +<hwtest/power_test.cpp> +<app/network.cpp> +<app/gate_servo.cpp>

; Unit test logika murni (lib/portal_logic) di laptop: pio test -e native
[env:native]
platform = native@1.2.1
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    throwtheswitch/Unity@2.6.1
test_build_src = no
